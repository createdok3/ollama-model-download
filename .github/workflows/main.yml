
name: Download Ollama Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Ollama model name (e.g. llama3.2:3b)"
        required: true
        type: string

jobs:
  download-model:
    runs-on: ubuntu-latest

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama server started"
              break
            fi
            sleep 2
          done

      - name: Download Model
        run: |
          MODEL="${{ inputs.model_name }}"
          echo "Downloading model: $MODEL"
          ollama pull "$MODEL"
          ollama list

      - name: Package Ollama Model
        run: |
          mkdir -p output

          cd ~/.ollama/models

          zip -r "$GITHUB_WORKSPACE/output/ollama-model.zip" \
            blobs manifests

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-model-${{ inputs.model_name }}
          path: output/ollama-model.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

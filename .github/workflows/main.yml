
name: Download Ollama Model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model name (e.g. llama3.2:3b)"
        required: true
        default: "llama3.2:3b"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Download selected model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          echo "Downloading model: $MODEL"
          ollama pull "$MODEL"
          ollama list

      - name: Package Ollama model folders
        run: |
          mkdir -p output
          tar -cf output/ollama-model.tar \
            -C "$HOME/.ollama" models

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-offline-model
          path: output/ollama-model.tar
          retention-days: 1

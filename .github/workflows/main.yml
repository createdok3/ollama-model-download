
name: Download Ollama Model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model name"
        required: true
        default: "nimble"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OLLAMA_MODELS: /tmp/ollama-models

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags

      - name: Download model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          ollama pull "$MODEL"

      - name: Verify downloaded files
        run: |
          echo "Checking model directory..."
          ls -lah "$OLLAMA_MODELS"
          test -d "$OLLAMA_MODELS/blobs"
          test -d "$OLLAMA_MODELS/manifests"

      - name: Package model
        run: |
          mkdir -p output
          tar -czf output/ollama-model.tar.gz \
            -C "$OLLAMA_MODELS" blobs manifests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-offline-model
          path: output/ollama-model.tar.gz
          retention-days: 1

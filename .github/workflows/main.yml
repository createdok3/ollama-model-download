
name: Download Ollama Model Offline

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model name"
        required: true
        default: "nimble"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OLLAMA_MODELS: /tmp/ollama-models

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Stop existing Ollama service
        run: |
          sudo systemctl stop ollama || true
          sudo pkill -x ollama || true
          sleep 3

      - name: Start Ollama with custom storage
        run: |
          mkdir -p "$OLLAMA_MODELS"

          nohup env OLLAMA_MODELS="$OLLAMA_MODELS" \
            ollama serve > /tmp/ollama.log 2>&1 &

          for i in {1..60}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama started successfully"
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:11434/api/tags
          
      - name: Download selected model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          echo "Downloading: $MODEL"
          ollama pull "$MODEL"

      - name: Verify model files
        run: |
          echo "Checking model directory:"
          du -sh "$OLLAMA_MODELS"
          find "$OLLAMA_MODELS" -maxdepth 3 -type f | head -30

          test -d "$OLLAMA_MODELS/blobs"
          test -d "$OLLAMA_MODELS/manifests"

          echo "Model files verified!"

      - name: Package offline model
        run: |
          mkdir -p output

          tar -czf output/ollama-model.tar.gz \
            -C "$OLLAMA_MODELS" blobs manifests

          ls -lh output/ollama-model.tar.gz

      - name: Upload offline model
        uses: actions/upload-artifact@v4
        with:
          name: ollama-offline-model
          path: output/ollama-model.tar.gz
          retention-days: 7
